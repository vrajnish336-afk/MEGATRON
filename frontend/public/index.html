<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEGATRON | AI Business Operations & Executive Command Center</title>
  <meta name="description" content="Next-generation AI Business Operations, Autonomous Governance, CRM Pipeline, and Intelligent Task Execution Engine.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <!-- Ambient High-Tech Grid & Lighting Layers -->
  <div class="command-grid-layer" id="command-grid-layer"></div>
  <div class="ambient-glow-orb ambient-glow-1"></div>
  <div class="ambient-glow-orb ambient-glow-2"></div>

  <div id="app">
    <!-- App dynamically renders here -->
    <div class="initial-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Initializing MEGATRON AI Command Center...</div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Global Modal Container -->
  <div id="modal-container" class="modal-container"></div>

  <!-- Scripts -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
