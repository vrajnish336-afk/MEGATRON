version: '3.8'

services:
  megadrone-app:
    build: .
    container_name: megadrone-business-os
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_FILE=/app/data/megadrone.sqlite
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
